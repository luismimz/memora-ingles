# Despliegue en Coolify: "Docker Compose" apuntando a este repo.
# Asigna el dominio (p. ej. https://ingles.luismontalvan.com) SOLO al servicio "web".
# Variables obligatorias: APP_URL, PUBLIC_URL, DIRECTUS_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD, DB_PASSWORD (ver .env.example).
services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - directus
    expose:
      - "80"

  # Voz neuronal natural para historias, frases y diálogos.
  # La imagen CPU funciona sin GPU y el modelo viene incluido; Coolify no publica este puerto.
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped
    expose:
      - "8880"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/v1/audio/voices', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  directus:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      tts:
        condition: service_healthy
    volumes:
      - uploads:/directus/uploads
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: memora
      DB_USER: memora
      DB_PASSWORD: ${DB_PASSWORD}
      WEBSOCKETS_ENABLED: "false"
      TELEMETRY: "false"
      PUBLIC_REGISTRATION: ${PUBLIC_REGISTRATION:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-chat}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-deepseek/deepseek-chat,google/gemini-2.5-flash,openai/gpt-4o-mini,anthropic/claude-haiku-4.5}
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-google/gemini-2.5-flash-image}
      FAL_KEY: ${FAL_KEY:-}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux/schnell}
      # Prepara las escenas absurdas y sus imágenes fuera de la sesión; es idempotente y solo genera las que faltan.
      PREPARE_ALL_ASSOCIATIONS: ${PREPARE_ALL_ASSOCIATIONS:-true}
      DISCOVERY_ENRICH_ON_BOOT: ${DISCOVERY_ENRICH_ON_BOOT:-true}
      DISCOVERY_TEXT_MODE: ${DISCOVERY_TEXT_MODE:-auto}
      DISCOVERY_IMAGE_MODE: ${DISCOVERY_IMAGE_MODE:-auto}
      DISCOVERY_ENRICH_LIMIT: ${DISCOVERY_ENRICH_LIMIT:-10}
      DISCOVERY_ENRICH_BATCH: ${DISCOVERY_ENRICH_BATCH:-2}
      AI_ALLOWED_EMAILS: ${AI_ALLOWED_EMAILS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      PRONUNCIATION_PROVIDER: ${PRONUNCIATION_PROVIDER:-datamuse}
      CANDIDATES_PROVIDER: ${CANDIDATES_PROVIDER:-datamuse}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-pollinations}
      SENTENCES_PROVIDER: ${SENTENCES_PROVIDER:-tatoeba}
      TTS_PROVIDER: ${TTS_PROVIDER:-kokoro}
      KOKORO_TTS_URL: ${KOKORO_TTS_URL:-http://tts:8880}
      KOKORO_TTS_API_KEY: ${KOKORO_TTS_API_KEY:-}
      KOKORO_TTS_MODEL: ${KOKORO_TTS_MODEL:-kokoro}
      KOKORO_TTS_VOICE: ${KOKORO_TTS_VOICE:-af_heart}
      KOKORO_LEXICON_VERSION: ${KOKORO_LEXICON_VERSION:-1}
      # Recuperar contraseña (email con enlace a https://tu-dominio/reset)
      PASSWORD_RESET_URL_ALLOW_LIST: ${APP_URL}/reset
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_SMTP_SECURE: ${EMAIL_SMTP_SECURE:-false}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  uploads:
