server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  # DNS interno de Docker. Resolver en cada petición (variable) evita que nginx se caiga
  # al arrancar si Directus aún no está listo: la app carga y la API responde en cuanto Directus arranca.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API de Directus en el mismo dominio: /api/... -> directus:8055/...
  location /api/ {
    set $directus http://directus:8055;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $directus;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s; # las llamadas a la IA pueden tardar
  }

  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
