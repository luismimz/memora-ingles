server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 20m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # V1 excluded /api/ from its offline navigation fallback. This exact route
  # provides a recovery page even when the old app intercepts other pages.
  location = /api/actualizar-memora {
    add_header Cache-Control "no-store" always;
    try_files /memora-update.html =404;
  }
  location /api/ {
    set $directus http://directus:8055;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $directus;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }
  location = /memora-update.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    error_page 404 = @missing_asset;
    try_files $uri =404;
  }
  location @missing_asset {
    add_header Cache-Control "no-store" always;
    return 404;
  }
  location / { try_files $uri $uri/ /index.html; }
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
